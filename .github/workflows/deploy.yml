name: Deploy Metal Riff Generator to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply legacy V23 riff engine when needed
        run: |
          if grep -q "RIFF_DNA_V23" index.html; then
            echo "V23/V28 riff engine already present; skip legacy patch"
          else
            python3 scripts/apply-riff-engine-v23.py
            python3 scripts/fix-v23-duplicate.py
            if git diff --quiet -- index.html && git diff --cached --quiet -- index.html; then
              echo "Legacy V23 already applied"
            else
              git add index.html
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "feat: activate V23 riff engine"
              git push
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
